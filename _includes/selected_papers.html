
          <div class="publications">
            {%- if page.selected_papers_order -%}
              {%- for key in page.selected_papers_order -%}
                {% bibliography -f {{ site.scholar.bibliography }} -q @*[key={{ key }}] %}
              {%- endfor -%}
            {%- else -%}
              {% bibliography -f {{ site.scholar.bibliography }} -q @*[selected=true]* %}
            {%- endif -%}
          </div>
